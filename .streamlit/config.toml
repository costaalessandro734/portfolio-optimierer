# Farben der App: Royalblau (Hauptfarbe) + Türkis (Nebenfarbe)
# Hell/Dunkel umschalten: Menü ⋮ oben rechts → Settings → Theme (Standard: wie dein Gerät)

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.75rem"
chartCategoricalColors = ["#2563EB", "#0FB5BA", "#6366F1", "#F59E0B", "#EC4899", "#10B981", "#8B5CF6", "#0EA5E9", "#F97316", "#94A3B8"]

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F7F9FD"
secondaryBackgroundColor = "#E9F0FE"
textColor = "#0F172A"
borderColor = "#D3DFF8"
dataframeHeaderBackgroundColor = "#EEF3FE"

[theme.light.sidebar]
backgroundColor = "#EDF3FF"
secondaryBackgroundColor = "#DFE9FD"

[theme.dark]
primaryColor = "#4F8BFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#17223A"
textColor = "#E6ECF8"
borderColor = "#263553"
dataframeHeaderBackgroundColor = "#131D33"

[theme.dark.sidebar]
backgroundColor = "#0E1729"
secondaryBackgroundColor = "#1A2742"
